[package]
name = "vibe-shot-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["global-shortcut", "clipboard-manager", "dialog-all"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"

# Screenshot and graphics
screenshot = "0.3"
image = "0.24"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Encryption for sensitive data
ring = "0.17"
base64 = "0.22"

# AI/ML (stub for future integration)
# ort = "1.16"  # For ONNX runtime - future feature

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
